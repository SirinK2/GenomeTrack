services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genometrack
      POSTGRES_USER: genometrack
      POSTGRES_PASSWORD: genometrack
    ports:
      - "5432:5432"
    volumes:
      - genometrack-data:/var/lib/postgresql/data
    healthcheck:
      # The API migrates on startup, so it must not start against a server that is still
      # initialising. Without this the first boot races the database and dies.
      test: ["CMD-SHELL", "pg_isready -U genometrack -d genometrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=genometrack;Username=genometrack;Password=genometrack"
      Jwt__SigningKey: "dev-only-signing-key-not-for-production-use"
    ports:
      - "8080:8080"

volumes:
  genometrack-data:
