name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - run: dotnet restore

      # Warnings are errors in CI but not locally: a work-in-progress branch should still
      # compile on a laptop, while nothing reaches main with a warning left in it.
      - run: dotnet build --no-restore --configuration Release -warnaserror

      - run: dotnet test --no-build --configuration Release --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      # Proves the image still builds. Nothing is pushed — this repository has no registry.
      - run: docker build -t genometrack:${{ github.sha }} .
